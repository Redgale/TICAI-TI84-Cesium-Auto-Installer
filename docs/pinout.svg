<svg viewBox="0 0 560 780" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="560" height="780" fill="#ffffff"/>

  <text x="280" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">
    field_mode wiring — Pico pinout
  </text>

  <!-- USB-C connector notch, well clear of the title -->
  <rect x="250" y="55" width="60" height="16" rx="4" fill="#c0c0c0" stroke="#888888" stroke-width="1.5"/>
  <text x="280" y="82" text-anchor="middle" font-size="10" fill="#555555">USB-C (BOOTSEL flashing only)</text>

  <!-- BOOTSEL button, moved clear of the USB-C label -->
  <rect x="205" y="92" width="24" height="16" rx="3" fill="#eeeeee" stroke="#999999"/>
  <text x="217" y="120" text-anchor="middle" font-size="9" fill="#666666">BOOTSEL</text>

  <!-- Board outline -->
  <rect x="190" y="110" width="180" height="570" rx="10" fill="#0d5c2e" stroke="#083d1f" stroke-width="2"/>

  <!-- ============ LEFT SIDE PINS (1 top -> 20 bottom), spacing 30px ============ -->
  <!-- Pin 1: GP0 -->
  <circle cx="190" cy="110" r="6" fill="#2f6fed" stroke="#0c2f8a" stroke-width="1.5"/>
  <line x1="184" y1="110" x2="120" y2="110" stroke="#2f6fed" stroke-width="1.5"/>
  <text x="115" y="107" text-anchor="end" font-size="11" fill="#0c2f8a" font-weight="bold">GP0 (pin 1)</text>
  <text x="115" y="119" text-anchor="end" font-size="10" fill="#333333">-&gt; debug RX</text>

  <!-- Pin 2: GP1 -->
  <circle cx="190" cy="140" r="6" fill="#2f6fed" stroke="#0c2f8a" stroke-width="1.5"/>
  <line x1="184" y1="140" x2="120" y2="140" stroke="#2f6fed" stroke-width="1.5"/>
  <text x="115" y="137" text-anchor="end" font-size="11" fill="#0c2f8a" font-weight="bold">GP1 (pin 2)</text>
  <text x="115" y="149" text-anchor="end" font-size="10" fill="#333333">-&gt; debug TX</text>

  <!-- Pin 3: GND -->
  <circle cx="190" cy="170" r="6" fill="#222222" stroke="#000000" stroke-width="1.5"/>
  <line x1="184" y1="170" x2="120" y2="170" stroke="#222222" stroke-width="1.5"/>
  <text x="115" y="167" text-anchor="end" font-size="11" fill="#000000" font-weight="bold">GND (pin 3)</text>
  <text x="115" y="179" text-anchor="end" font-size="10" fill="#333333">-&gt; debug GND</text>

  <!-- Pins 4-19: unused, plain grey dots -->
  <g fill="#bbbbbb" stroke="#888888" stroke-width="1">
    <circle cx="190" cy="200" r="4"/><circle cx="190" cy="230" r="4"/><circle cx="190" cy="260" r="4"/>
    <circle cx="190" cy="290" r="4"/><circle cx="190" cy="320" r="4"/><circle cx="190" cy="350" r="4"/>
    <circle cx="190" cy="380" r="4"/><circle cx="190" cy="410" r="4"/><circle cx="190" cy="440" r="4"/>
    <circle cx="190" cy="470" r="4"/><circle cx="190" cy="500" r="4"/><circle cx="190" cy="530" r="4"/>
    <circle cx="190" cy="560" r="4"/><circle cx="190" cy="590" r="4"/><circle cx="190" cy="620" r="4"/>
    <circle cx="190" cy="650" r="4"/>
  </g>

  <!-- Pin 20: GP15 (bottom-left) -->
  <circle cx="190" cy="680" r="6" fill="#e08a1e" stroke="#8a5210" stroke-width="1.5"/>
  <line x1="184" y1="680" x2="120" y2="680" stroke="#e08a1e" stroke-width="1.5"/>
  <text x="115" y="677" text-anchor="end" font-size="11" fill="#8a5210" font-weight="bold">GP15 (pin 20)</text>
  <text x="115" y="689" text-anchor="end" font-size="10" fill="#333333">-&gt; button -&gt; GND</text>

  <!-- ============ RIGHT SIDE PINS (40 top -> 21 bottom) ============ -->
  <!-- Pin 40: VBUS -->
  <circle cx="370" cy="110" r="6" fill="#d1263a" stroke="#7a0f1c" stroke-width="1.5"/>
  <line x1="376" y1="110" x2="440" y2="110" stroke="#d1263a" stroke-width="1.5"/>
  <text x="445" y="107" font-size="11" fill="#7a0f1c" font-weight="bold">VBUS (pin 40)</text>
  <text x="445" y="119" font-size="10" fill="#333333">&lt;- boost +5V</text>

  <!-- Pin 39: VSYS (explicitly flagged unused) -->
  <circle cx="370" cy="140" r="5" fill="#dddddd" stroke="#999999" stroke-width="1.5"/>
  <line x1="376" y1="140" x2="440" y2="140" stroke="#999999" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="445" y="137" font-size="10" fill="#999999">VSYS (39) unused</text>
  <text x="445" y="149" font-size="9" fill="#999999">don't also wire this</text>

  <!-- Pin 38: GND -->
  <circle cx="370" cy="170" r="6" fill="#222222" stroke="#000000" stroke-width="1.5"/>
  <line x1="376" y1="170" x2="440" y2="170" stroke="#222222" stroke-width="1.5"/>
  <text x="445" y="167" font-size="11" fill="#000000" font-weight="bold">GND (pin 38)</text>
  <text x="445" y="179" font-size="10" fill="#333333">&lt;- boost GND</text>

  <!-- Pins 37-25: unused -->
  <g fill="#bbbbbb" stroke="#888888" stroke-width="1">
    <circle cx="370" cy="200" r="4"/><circle cx="370" cy="230" r="4"/><circle cx="370" cy="260" r="4"/>
    <circle cx="370" cy="290" r="4"/><circle cx="370" cy="320" r="4"/><circle cx="370" cy="350" r="4"/>
    <circle cx="370" cy="380" r="4"/><circle cx="370" cy="410" r="4"/><circle cx="370" cy="440" r="4"/>
    <circle cx="370" cy="470" r="4"/><circle cx="370" cy="500" r="4"/><circle cx="370" cy="530" r="4"/>
    <circle cx="370" cy="560" r="4"/>
  </g>

  <!-- Pin 24: GP18 -->
  <circle cx="370" cy="590" r="6" fill="#1f9e4d" stroke="#0e5c2a" stroke-width="1.5"/>
  <line x1="376" y1="590" x2="440" y2="590" stroke="#1f9e4d" stroke-width="1.5"/>
  <text x="445" y="587" font-size="11" fill="#0e5c2a" font-weight="bold">GP18 (pin 24)</text>
  <text x="445" y="599" font-size="10" fill="#333333">-&gt; resistor -&gt; LED</text>

  <!-- Pin 23: GND -->
  <circle cx="370" cy="620" r="6" fill="#222222" stroke="#000000" stroke-width="1.5"/>
  <line x1="376" y1="620" x2="440" y2="620" stroke="#222222" stroke-width="1.5"/>
  <text x="445" y="617" font-size="11" fill="#000000" font-weight="bold">GND (pin 23)</text>
  <text x="445" y="629" font-size="10" fill="#333333">-&gt; LED cathode</text>

  <!-- Pins 22, 21: unused -->
  <g fill="#bbbbbb" stroke="#888888" stroke-width="1">
    <circle cx="370" cy="650" r="4"/><circle cx="370" cy="680" r="4"/>
  </g>

  <!-- Legend -->
  <g transform="translate(30,730)">
    <circle cx="0" cy="0" r="6" fill="#d1263a" stroke="#7a0f1c" stroke-width="1.5"/>
    <text x="11" y="4" font-size="10" fill="#333333">Power</text>

    <circle cx="70" cy="0" r="6" fill="#222222" stroke="#000000" stroke-width="1.5"/>
    <text x="81" y="4" font-size="10" fill="#333333">GND</text>

    <circle cx="130" cy="0" r="6" fill="#1f9e4d" stroke="#0e5c2a" stroke-width="1.5"/>
    <text x="141" y="4" font-size="10" fill="#333333">LED</text>

    <circle cx="185" cy="0" r="6" fill="#e08a1e" stroke="#8a5210" stroke-width="1.5"/>
    <text x="196" y="4" font-size="10" fill="#333333">Button</text>

    <circle cx="255" cy="0" r="6" fill="#2f6fed" stroke="#0c2f8a" stroke-width="1.5"/>
    <text x="266" y="4" font-size="10" fill="#333333">Debug UART</text>

    <circle cx="365" cy="0" r="5" fill="#bbbbbb" stroke="#888888" stroke-width="1"/>
    <text x="376" y="4" font-size="10" fill="#333333">Unused</text>
  </g>
</svg>
